<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Darts 100 Gallery</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
      .card h3 { margin: 0 0 4px; font-size: 14px; color: var(--accent); }
      .card canvas.avatar { width: 48px; height: 48px; float: left; margin: 0 10px 4px 0; }
      .card canvas.board { width: 100%; aspect-ratio: 1; display: block; }
      .stats { clear: both; color: var(--muted); }
      .bar { height: 6px; background: var(--bg); border-radius: 3px; margin: 2px 0 6px; }
      .bar > div { height: 100%; border-radius: 3px; background: var(--good); }
    </style>
  </head>
  <body>
    <header>
      <h1>Darts 100 · Gallery</h1>
      <p class="tag">Everything the community has built so far. Reviewers: check the art and the tone here.</p>
      <nav><a href="index.html">Play</a></nav>
    </header>
    <h2 style="margin-top: 16px">Players <small id="player-count"></small></h2>
    <div id="players" class="grid"></div>
    <h2 style="margin-top: 16px">Boards</h2>
    <div id="boards" class="grid"></div>
    <h2 style="margin-top: 16px">Game modes</h2>
    <div id="modes" class="grid"></div>
    <script type="module" src="gallery.js"></script>
  </body>
</html>
